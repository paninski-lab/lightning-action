model:
  model_class: resnet
  model_params:
    # Architecture variant: resnet18, resnet34, resnet50, resnet101, resnet152
    backbone: resnet50
    
    # Input
    image_size: 224
    num_channels: 3
    
    # Output feature dimensions (determined by backbone):
    #   resnet18:  512
    #   resnet34:  512
    #   resnet50:  2048
    #   resnet101: 2048
    #   resnet152: 2048
    hidden_size: 2048
