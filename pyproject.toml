[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "lightning-action"
version = "1.0.2"
description = "Action segmentation framework built with PyTorch Lightning"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Matt Whiteway" },
]

keywords = ["machine learning", "deep learning", "action segmentation", "computer vision"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "jaxtyping",
    "lightning (~=2.5)",
    "numpy (>=2.0.0)",
    "nvidia-dali-cuda110",
    "opencv-python-headless",
    "scikit-learn",
    "tensorboard",
    "torch",
    "torchvision",
    "transformers",
    "typeguard (<3.0.0)",
    "pandas",
    "pyyaml",
]

[project.urls]
repository = "https://github.com/paninski-lab/lightning-action"
documentation = "https://github.com/paninski-lab/lightning-action"

# project.dependencies are used for metadata when building the project, tool.poetry.dependencies is only used to enrich
# project.dependencies for locking
[tool.poetry.dependencies]
python = ">=3.10,<3.13"

[tool.poetry.scripts]
litaction = "lightning_action.cli.main:main"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-html",
    "requests",
    "ruff",
]

[tool.ruff]
line-length = 99
exclude = [
    ".git",
    "__pycache__",
    "/build",
    "/configs",
    "/data",
    "/dist",
    "/docs",
    "/scripts",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports/variables)
    "I",   # isort
    "UP",  # pyupgrade (modernize syntax: Tuple->tuple, Union->|, etc.)
    "B",   # flake8-bugbear (real bugs: mutable defaults, broad excepts, etc.)
    # "N",   # pep8-naming
]
ignore = [
    # F821: flags undefined names; produces false positives for forward references in
    # type annotations and dynamically defined names (e.g. jaxtyping's Float)
    "F821",
    # F722: jaxtyping uses string annotations like Float[torch.Tensor, 'batch seq feat']
    # that ruff incorrectly parses as syntax errors in forward annotations
    "F722",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["lightning_action"]

[tool.pytest.ini_options]
testpaths = "tests"
generate_report_on_test = "True"
markers = ["multigpu"]
